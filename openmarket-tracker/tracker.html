<title>Mercado Abierto</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Una pantalla: fila de activos arriba, cabecera del par y el gráfico ocupando el resto */
:root {
  --bg: #f3f5f8; --panel: #ffffff; --line: #dfe4ec; --fg: #141a24; --muted: #5d6879;
  --accent: #2f5bea; --accent-soft: #e6ecfd; --up: #0e9f6e; --down: #d63a4a;
  --up-soft: rgba(14,159,110,.28); --down-soft: rgba(214,58,74,.28); --warn: #b7791f;
  --ui: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0f16; --panel: #121822; --line: #222b39; --fg: #e4e9f1; --muted: #8a96a8;
  --accent: #6d8dff; --accent-soft: #1b2440; --up: #22c38e; --down: #f0566a;
  --up-soft: rgba(34,195,142,.3); --down-soft: rgba(240,86,106,.3); --warn: #e0a84a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0f16; --panel: #121822; --line: #222b39; --fg: #e4e9f1; --muted: #8a96a8;
  --accent: #6d8dff; --accent-soft: #1b2440; --up: #22c38e; --down: #f0566a;
  --up-soft: rgba(34,195,142,.3); --down-soft: rgba(240,86,106,.3); --warn: #e0a84a; color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--up) } .down { color: var(--down) } .muted { color: var(--muted) }
button, input { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }

.app { height: 100%; display: flex; flex-direction: column; gap: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px; }

/* Fila de activos */
.bar { display: flex; align-items: center; gap: 10px; min-width: 0 }
.brand { font-weight: 700; font-size: 15px; white-space: nowrap }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); white-space: nowrap }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted) }
.pill.live .dot { background: var(--up) } .pill.demo .dot { background: var(--warn) }
.syms { display: flex; gap: 4px; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none }
.syms::-webkit-scrollbar { display: none }
.sym { display: flex; align-items: baseline; gap: 6px; border: 1px solid transparent; background: none; border-radius: 7px; padding: 5px 8px 5px 10px; white-space: nowrap; font-size: 13px }
.sym:hover { background: var(--panel) }
.sym.on { background: var(--panel); border-color: var(--line) }
.sym b { font-weight: 600 }
.sym .num { font-size: 11.5px }
.sym .rm { border: 0; background: none; color: var(--muted); padding: 0 2px; opacity: 0 }
.sym:hover .rm, .sym.on .rm { opacity: 1 }
form.add input { width: 96px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel) }
.iconbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 7px; padding: 5px 10px; font-size: 12px }

/* Gráfico */
.chartcard { flex: 1; min-height: 360px; display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden }
.chead { display: flex; align-items: center; gap: 22px; padding: 12px 14px; flex-wrap: wrap }
.name { font-size: 15px; font-weight: 600; color: var(--muted) }
.last { font-size: 26px; font-weight: 600; line-height: 1.1 }
.stats { display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px }
.stats div { display: grid; gap: 1px }
.stats small { color: var(--muted); font-size: 11px; font-family: var(--ui) }
.tfs { margin-left: auto; display: flex; gap: 2px; background: var(--bg); padding: 3px; border-radius: 7px }
.tfs button { border: 0; background: none; padding: 4px 10px; border-radius: 5px; font-size: 12px; color: var(--muted); font-family: var(--mono) }
.tfs button.on { background: var(--panel); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.15) }
#chart { flex: 1; position: relative; min-height: 0 }
.nochart { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted) }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--warn); padding: 10px 14px; border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.2); max-width: 320px; font-size: 13px; z-index: 20 }

@media (max-width: 760px) {
  .bar { flex-wrap: wrap } .syms { order: 3; flex-basis: 100% }
  .tfs { margin-left: 0 } .last { font-size: 22px }
}
</style>

<div class="app">
  <div class="bar">
    <span class="brand">Mercado Abierto</span>
    <span id="status" class="pill"><span class="dot"></span><span id="statusTxt">Conectando…</span></span>
    <div class="syms" id="syms" role="tablist" aria-label="Activos"></div>
    <form class="add" id="addSym"><input id="symInput" placeholder="+ Añadir" autocomplete="off" aria-label="Añadir símbolo, p. ej. AVAX"></form>
    <button id="themeBtn" class="iconbtn" type="button">Tema</button>
  </div>

  <section class="chartcard" aria-label="Gráfico">
    <div class="chead">
      <div><div class="name" id="cName">—</div><div class="last num" id="cLast">—</div></div>
      <div class="stats num">
        <div><small>24 h</small><span id="cChg">—</span></div>
        <div><small>Máx. 24 h</small><span id="cHigh">—</span></div>
        <div><small>Mín. 24 h</small><span id="cLow">—</span></div>
        <div><small>Volumen 24 h</small><span id="cVol">—</span></div>
      </div>
      <div class="tfs" id="tfs"></div>
    </div>
    <div id="chart"><div class="nochart" id="nochart">Cargando gráfico…</div></div>
  </section>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
(() => {
const REST = 'https://data-api.binance.vision/api/v3';
const WS = 'wss://data-stream.binance.vision/stream?streams=';
const TFS = ['1m','5m','15m','1h','4h','1d'];
const QUOTES = ['USDT','USDC','FDUSD','BTC','ETH','BNB','EUR','TRY'];
const KEY = 'mercado-abierto-v2';
const DEMO_SEED = { BTCUSDT: 67250, ETHUSDT: 3480, SOLUSDT: 172, BNBUSDT: 590, XRPUSDT: 0.62, DOGEUSDT: 0.158 };
const $ = id => document.getElementById(id);

// ---------- estado ----------
const defaults = () => ({ watch: ['BTCUSDT','ETHUSDT','SOLUSDT','BNBUSDT','XRPUSDT','DOGEUSDT'], sel: 'BTCUSDT', tf: '1h' });
let S;
try { S = Object.assign(defaults(), JSON.parse(localStorage.getItem(KEY) || 'null') || {}); } catch { S = defaults(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

const T = {};            // sym -> {last, open, high, low, qvol}
let mode = 'connecting'; // live | demo
let ws = null, wsKey = '';
let chart, candles, vols, lastBar = null, bars = [];

// ---------- formato ----------
const split = s => { const q = QUOTES.find(q => s.endsWith(q) && s.length > q.length); return q ? [s.slice(0, -q.length), q] : [s, '']; };
const fmtP = p => {
  if (p == null || !isFinite(p)) return '—';
  const a = Math.abs(p), d = a >= 1000 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 5 : 8;
  return p.toLocaleString('es-ES', { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d });
};
const fmtPct = v => (v == null || !isFinite(v)) ? '—' : (v > 0 ? '+' : '') + v.toFixed(2).replace('.', ',') + ' %';
const fmtBig = v => { if (!isFinite(v)) return '—'; const u = [[1e9,' mil M'],[1e6,' M'],[1e3,' k']].find(([n]) => v >= n); return u ? (v/u[0]).toFixed(2).replace('.', ',') + u[1] : v.toFixed(0); };
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'muted';
const chg = t => t && t.open ? (t.last - t.open) / t.open * 100 : null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const normSym = raw => { let s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (s && !QUOTES.some(q => s.endsWith(q) && s.length > q.length)) s += 'USDT'; return s; };

// ---------- datos en vivo ----------
const api = async p => { const r = await fetch(REST + p); if (!r.ok) throw new Error(r.status); return r.json(); };
async function loadTickers(syms) {
  const d = await api('/ticker/24hr?symbols=' + encodeURIComponent(JSON.stringify(syms)));
  d.forEach(x => { T[x.symbol] = { last: +x.lastPrice, open: +x.openPrice, high: +x.highPrice, low: +x.lowPrice, qvol: +x.quoteVolume }; });
}
const klines = async (s, tf) => (await api(`/klines?symbol=${s}&interval=${tf}&limit=500`)).map(r => ({ time: r[0]/1000, open: +r[1], high: +r[2], low: +r[3], close: +r[4], volume: +r[5] }));

function openSocket() {
  const key = S.watch.join(',') + '|' + S.sel + '|' + S.tf;
  if (mode !== 'live' || key === wsKey) return;
  wsKey = key;
  if (ws) { ws.onclose = null; ws.close(); }
  const streams = S.watch.map(s => s.toLowerCase() + '@miniTicker').concat(S.sel.toLowerCase() + '@kline_' + S.tf);
  ws = new WebSocket(WS + streams.join('/'));
  ws.onmessage = ev => {
    const { stream, data } = JSON.parse(ev.data);
    if (stream.endsWith('@miniticker')) {
      T[data.s] = { last: +data.c, open: +data.o, high: +data.h, low: +data.l, qvol: +data.q };
      tick();
    } else if (data.s === S.sel) {
      const k = data.k;
      pushBar({ time: k.t/1000, open: +k.o, high: +k.h, low: +k.l, close: +k.c, volume: +k.v });
    }
  };
  ws.onclose = () => { wsKey = ''; setTimeout(openSocket, 3000); };
}

// ---------- datos de demostración ----------
const rnd = (s => () => (s = (s * 16807) % 2147483647) / 2147483647)(42);
function demoTicker(s) {
  if (T[s]) return;
  const p = DEMO_SEED[s] || +(1 + rnd() * 50).toFixed(2), o = p * (1 + (rnd() - .5) * .06);
  T[s] = { last: p, open: o, high: Math.max(p, o) * 1.01, low: Math.min(p, o) * .99, qvol: p * 1e5 * (5 + rnd() * 50) };
}
function demoKlines(s, tf) {
  const sec = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400 }[tf];
  const now = Math.floor(Date.now() / 1000 / sec) * sec, vol = .004 * Math.sqrt(sec / 60) / 3;
  let p = T[s].last, out = [];
  for (let i = 0; i < 300; i++) {
    const c = p, o = c / (1 + (rnd() - .5) * 2 * vol);
    out.unshift({ time: now - i * sec, open: o, close: c, high: Math.max(o, c) * (1 + rnd() * vol), low: Math.min(o, c) * (1 - rnd() * vol), volume: 50 + rnd() * 400 });
    p = o;
  }
  return out;
}
function demoStep() {
  S.watch.forEach(s => { const t = T[s]; if (!t) return; t.last *= 1 + (rnd() - .5) * .0016; t.high = Math.max(t.high, t.last); t.low = Math.min(t.low, t.last); });
  const t = T[S.sel];
  if (t && lastBar) pushBar({ ...lastBar, close: t.last, high: Math.max(lastBar.high, t.last), low: Math.min(lastBar.low, t.last), volume: lastBar.volume + rnd() * 3 });
  tick();
}

// ---------- render ----------
function setStatus() {
  $('status').className = 'pill ' + mode;
  $('statusTxt').textContent = mode === 'live' ? 'En vivo' : mode === 'demo' ? 'Demostración' : 'Conectando…';
  $('status').title = mode === 'demo' ? 'No se pudo conectar con la API pública de Binance (en el visor de artefactos las llamadas externas están bloqueadas). Abre el archivo en el navegador para ver precios reales.' : 'Binance spot';
}
function renderSyms() {
  $('syms').innerHTML = S.watch.map(s => {
    const t = T[s], c = chg(t);
    return `<button type="button" role="tab" aria-selected="${s === S.sel}" class="sym ${s === S.sel ? 'on' : ''}" data-s="${s}"><b>${split(s)[0]}</b><span class="num ${cls(c)}">${fmtPct(c)}</span><span class="rm" data-rm="${s}" aria-label="Quitar" title="Quitar">×</span></button>`;
  }).join('');
}
function renderHead() {
  const t = T[S.sel], c = chg(t), [b, q] = split(S.sel);
  $('cName').textContent = b + ' / ' + q;
  $('cLast').textContent = fmtP(t && t.last);
  $('cLast').className = 'last num ' + cls(c);
  $('cChg').innerHTML = `<span class="${cls(c)}">${fmtPct(c)}</span>`;
  $('cHigh').textContent = fmtP(t && t.high);
  $('cLow').textContent = fmtP(t && t.low);
  $('cVol').textContent = t ? fmtBig(t.qvol) + ' ' + q : '—';
  document.title = t ? `${fmtP(t.last)} ${b} · Mercado Abierto` : 'Mercado Abierto';
}
let raf = 0;
function tick() { if (raf) return; raf = requestAnimationFrame(() => { raf = 0; renderSyms(); renderHead(); }); }
function renderTfs() { $('tfs').innerHTML = TFS.map(t => `<button type="button" data-tf="${t}" class="${t === S.tf ? 'on' : ''}">${t}</button>`).join(''); }

// ---------- gráfico ----------
function chartColors() {
  return { layout: { background: { type: 'solid', color: css('--panel') }, textColor: css('--muted'), fontFamily: 'JetBrains Mono, monospace', fontSize: 11 },
    grid: { vertLines: { color: css('--line') }, horzLines: { color: css('--line') } },
    rightPriceScale: { borderColor: css('--line') }, timeScale: { borderColor: css('--line'), timeVisible: true, secondsVisible: false } };
}
const candleColors = () => ({ upColor: css('--up'), downColor: css('--down'), wickUpColor: css('--up'), wickDownColor: css('--down') });
const volBar = b => ({ time: b.time, value: b.volume, color: b.close >= b.open ? css('--up-soft') : css('--down-soft') });
function initChart() {
  if (!window.LightweightCharts) { $('nochart').textContent = 'No se pudo cargar la librería de gráficos.'; return; }
  chart = LightweightCharts.createChart($('chart'), Object.assign({ autoSize: true, localization: { locale: 'es-ES', priceFormatter: fmtP } }, chartColors()));
  candles = chart.addCandlestickSeries(Object.assign({ borderVisible: false }, candleColors()));
  vols = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: .85, bottom: 0 } });
  const restyle = () => { chart.applyOptions(chartColors()); candles.applyOptions(candleColors()); vols.setData(bars.map(volBar)); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
  new MutationObserver(restyle).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
}
function pushBar(b) {
  if (!candles || (lastBar && b.time < lastBar.time)) return;
  candles.update(b); vols.update(volBar(b));
  if (lastBar && b.time === lastBar.time) bars[bars.length - 1] = b; else bars.push(b);
  lastBar = b;
}
async function loadChart() {
  if (!candles) return;
  try {
    bars = mode === 'live' ? await klines(S.sel, S.tf) : demoKlines(S.sel, S.tf);
    candles.setData(bars); vols.setData(bars.map(volBar));
    lastBar = bars[bars.length - 1];
    chart.timeScale().fitContent();
    $('nochart').hidden = true;
  } catch { $('nochart').hidden = false; $('nochart').textContent = 'No hay datos de velas para este par.'; }
}

// ---------- acciones ----------
function toast(msg) {
  const el = document.createElement('div'); el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 6000);
}
async function addWatch(sym) {
  if (!sym) return false;
  if (S.watch.includes(sym)) return true;
  try { if (mode === 'live') await loadTickers([sym]); else demoTicker(sym); if (!T[sym]) throw 0; }
  catch { toast(`No encuentro el par ${sym} en Binance spot. Prueba otro símbolo o cotización (p. ej. ${split(sym)[0]}USDC).`); return false; }
  S.watch.push(sym); save();
  return true;
}
async function select(sym) {
  S.sel = sym; save(); tick(); openSocket();
  await loadChart();
}

async function boot() {
  initChart();
  try {
    await loadTickers(S.watch.slice(0, 1));
    mode = 'live';
    await loadTickers(S.watch).catch(async () => { for (const s of S.watch) await loadTickers([s]).catch(() => {}); });
    S.watch = S.watch.filter(s => T[s]);
  } catch {
    mode = 'demo';
    S.watch.forEach(demoTicker);
    setInterval(demoStep, 1000);
  }
  if (!S.watch.includes(S.sel)) S.sel = S.watch[0];
  setStatus(); renderTfs();
  await select(S.sel);
}

$('tfs').onclick = e => { const b = e.target.closest('[data-tf]'); if (!b) return; S.tf = b.dataset.tf; save(); renderTfs(); openSocket(); loadChart(); };
$('syms').onclick = e => {
  const rm = e.target.closest('[data-rm]');
  if (rm) {
    const s = rm.dataset.rm; if (S.watch.length <= 1) return;
    S.watch = S.watch.filter(x => x !== s); save();
    if (S.sel === s) select(S.watch[0]); else { tick(); openSocket(); }
    return;
  }
  const b = e.target.closest('[data-s]'); if (b && b.dataset.s !== S.sel) select(b.dataset.s);
};
$('addSym').onsubmit = async e => { e.preventDefault(); const s = normSym($('symInput').value); if (await addWatch(s)) { $('symInput').value = ''; select(s); } };
$('themeBtn').onclick = () => {
  const root = document.documentElement, cur = root.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  root.dataset.theme = cur === 'dark' ? 'light' : 'dark';
};

renderSyms(); setStatus();
boot();
})();
</script>
